name: Release

# Push a version tag (e.g. `git tag v0.9.0 && git push origin v0.9.0`) and this
# builds + tests the release, then creates the GitHub Release automatically with
# generated notes and the sdist/wheel attached.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to publish (for example, v0.13.4)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # full history so notes can diff from the last tag
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate release tag
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo "Release tag must start with v: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build twine
          pytest -q
      - name: Build distributions
        run: |
          python -m build
          twine check dist/*
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; nothing to create."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            dist/*
